<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XHR Profile Card</title>

<style>
    body {
        font-family: Arial;
        display: flex;
        justify-content: center;
        margin-top: 50px;
    }

    .card {
        width: 300px;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        text-align: center;
    }

    img {
        width: 100px;
        border-radius: 50%;
    }

    button {
        margin-top: 10px;
        padding: 10px;
        background: blue;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="card">
    <img id="avatar" src="">
    <h2 id="name">Click button</h2>
    <p id="followers"></p>
    <p id="repos"></p>
    <button onclick="loadData()">Load GitHub Profile</button>
</div>

<script>
function loadData() {

    const requestUrl = 'https://api.github.com/users/hiteshchoudhary'
    const xhr = new XMLHttpRequest()

    xhr.open('GET', requestUrl)

    xhr.onreadystatechange = function () {

        console.log("State:", xhr.readyState);

        if (xhr.readyState === 4) {
            const data = JSON.parse(this.responseText)

            // Update UI
            document.getElementById("avatar").src = data.avatar_url
            document.getElementById("name").innerText = data.name
            document.getElementById("followers").innerText = "Followers: " + data.followers
            document.getElementById("repos").innerText = "Public Repos: " + data.public_repos
        }
    }

    xhr.send()
}
</script>

</body>
</html>
