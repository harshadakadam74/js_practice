<!DOCTYPE html>
<html>
<head>
    <title>Multiple Profile Cards</title>
    <style>
        body {
            font-family: Arial;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .card {
            width: 300px;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
        }

        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }

        .info {
            font-size: 14px;
            text-align: left;
            margin-top: 10px;
        }

        .info p {
            margin: 4px 0;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 10px 0;
        }

        .stats div {
            cursor: pointer;
            color: blue;
        }

        .list {
            margin-top: 10px;
            max-height: 120px;
            overflow-y: auto;
            text-align: left;
            font-size: 14px;
        }
    </style>
</head>

<body>

<script>
async function loadUsers() {
    const res = await fetch("https://jsonplaceholder.typicode.com/users");
    const users = await res.json();

    users.forEach(user => createCard(user));
}

function createCard(user) {
    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.className = "profile-img";
    img.src = `https://i.pravatar.cc/150?img=${user.id}`;

    const name = document.createElement("h3");
    name.innerText = user.name;

    const email = document.createElement("p");
    email.innerText = user.email;

    // 🔹 Extra Info Section
    const info = document.createElement("div");
    info.className = "info";
    info.innerHTML = `
        <p>📱 ${user.phone}</p>
        <p>🌐 ${user.website}</p>
        <p>🏢 ${user.company.name}</p>
        <p>📍 ${user.address.city}</p>
    `;

    const stats = document.createElement("div");
    stats.className = "stats";

    stats.innerHTML = `
        <div class="followersBox"><strong>5</strong><br>Followers</div>
        <div><strong>3</strong><br>Following</div>
        <div class="postsBox"><strong>10</strong><br>Posts</div>
    `;

    const list = document.createElement("div");
    list.className = "list";

    stats.addEventListener("click", async (e) => {

        if (e.target.closest(".followersBox")) {
            list.innerHTML = "Loading followers...";

            const res = await fetch("https://jsonplaceholder.typicode.com/users");
            const users = await res.json();

            list.innerHTML = "<b>Followers:</b>";
            users.slice(0, 3).forEach(u => {
                list.innerHTML += `<p>👤 ${u.name}</p>`;
            });
        }

        if (e.target.closest(".postsBox")) {
            list.innerHTML = "Loading posts...";

            const res = await fetch(`https://jsonplaceholder.typicode.com/posts?userId=${user.id}`);
            const posts = await res.json();

            list.innerHTML = "<b>Posts:</b>";
            posts.slice(0, 3).forEach(p => {
                list.innerHTML += `<p>📝 ${p.title}</p>`;
            });
        }
    });

    card.appendChild(img);
    card.appendChild(name);
    card.appendChild(email);
    card.appendChild(info);   // 👈 added details
    card.appendChild(stats);
    card.appendChild(list);

    document.body.appendChild(card);
}

loadUsers();
</script>

</body>
</html>
